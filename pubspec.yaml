name: students_profile
description: A new Flutter project.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  animate_do: ^5.1.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.2.0
  go_router: ^18.0.2
  sqflite: ^2.4.4+1
  path: ^1.9.1
  google_generative_ai: ^0.4.7
  rive: ^0.13.1
  flutter_local_notifications: ^22.3.1
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
  - assets/images/
  fonts:
  - family: SpaceGrotesk
    fonts:
    - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - asset: assets/fonts/SpaceGrotesk-Bold.ttf
      weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
